name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # For more specific OS versions, you can specify them explicitly:
        # os: [ubuntu-20.04, windows-2019, macos-11]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: "3.20.0"  # Specify the minimum version you need

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y ninja
          choco install -y llvm  # Clang on Windows if needed
          # choco install -y visualstudio2019community
        shell: pwsh

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja
          brew install llvm

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++
          # Or specify other options as needed
      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  dependency-chart:
    name: Dependency chart
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

      - name: Show the dependency chart on the run's summary page
        run: cat doc/THMXParser.md >> "$GITHUB_STEP_SUMMARY"

      - name: Copy the chart into doc and commit it when it changed
        if: github.ref == 'refs/heads/rework/bcs'
        run: |
          cp doc/THMXParser.md doc/DependencyChart.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/DependencyChart.md
          git diff --cached --quiet && exit 0
          git commit -m "Refresh dependency chart [skip ci]"
          git pull --rebase origin rework/bcs
          git push origin HEAD:rework/bcs
